name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish SequenceGapScanner.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o ./publish

      - name: Build zip
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          $files = Get-ChildItem ./publish -File | Where-Object { $_.Extension -ne ".pdb" }
          Compress-Archive -Path $files.FullName -DestinationPath "SequenceGapScanner-${version}-Standalone-win-x64.zip"

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version installer.iss

      - name: Rename installer
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          Rename-Item "installer\SequenceGapScanner-Setup.exe" "SequenceGapScanner-${version}-Installer-win-x64.exe"

      - name: Upload assets
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          gh release upload $version "SequenceGapScanner-${version}-Standalone-win-x64.zip" "installer\SequenceGapScanner-${version}-Installer-win-x64.exe"
        env:
          GH_TOKEN: ${{ github.token }}
